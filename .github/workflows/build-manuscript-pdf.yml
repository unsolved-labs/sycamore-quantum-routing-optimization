name: Build R005 manuscript PDF

on:
  push:
    branches:
      - upgrade/r005-exact-verification-manuscript
    paths:
      - manuscript/r005_sycamore_routing.tex
      - manuscript/Makefile
      - .github/workflows/build-manuscript-pdf.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/r005-exact-verification-manuscript
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended
      - name: Build manuscript
        run: make -C manuscript
      - name: Commit reproducible PDF
        run: |
          git add manuscript/r005_sycamore_routing.pdf
          if git diff --cached --quiet; then
            echo "PDF already matches committed source"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build R005 manuscript PDF"
          git push origin HEAD:"$GITHUB_REF_NAME"
