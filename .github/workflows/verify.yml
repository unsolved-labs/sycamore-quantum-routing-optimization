name: Verify R005

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify route and exact GF(2) equivalence
        run: |
          python verify.py
          python verify_linear_equivalence.py
      - name: Verify depth metrics
        run: |
          python compute_qasm_depth.py original_vqe_8_4_10_100.qasm mapped_route.qasm
          python - <<'PY'
          import json
          r=json.load(open('depth_metrics.json'))
          assert r[0]['native_instruction_depth']==102
          assert r[1]['native_instruction_depth']==110
          assert r[1]['swap']==13
          assert r[1]['cx']==71
          PY
      - name: Full all-basis unitary check
        run: |
          python -m pip install --disable-pip-version-check numpy
          python build_and_verify_full_qasm.py route.json
          python - <<'PY'
          import json
          r=json.load(open('full_unitary_route.json'))
          assert r['mapped_swaps']==13
          assert r['all_logical_basis_inputs_verified']==256
          assert r['max_absolute_amplitude_error'] < 2e-13
          PY
